# Included INSIDE the existing Nextcloud VirtualHost, not globally.
# Based on ONLYOFFICE/document-server-proxy/apache/proxy-to-virtual-path.conf.
RedirectMatch 308 ^/onlyoffice$ /onlyoffice/
<Location /onlyoffice/>
    Require all granted
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "ONLYOFFICE_PUBLIC_AUTHORITY/onlyoffice"
    RequestHeader unset X-Forwarded-Prefix
    RequestHeader unset CloudFront-Forwarded-Proto
    ProxyAddHeaders Off
</Location>
ProxyPass /onlyoffice/ http://127.0.0.1:ONLYOFFICE_NGINX_PORT/ upgrade=websocket timeout=3600
ProxyPassReverse /onlyoffice/ http://127.0.0.1:ONLYOFFICE_NGINX_PORT/

# Block private interfaces before forwarding to the ONLYOFFICE jail.
# Match version-prefixed paths too, as the packaged nginx configuration does.
<LocationMatch "(?i)^/onlyoffice/(?:[0-9]+\.[0-9]+\.[0-9]+[.|-]\w+/)?(?:internal|info|admin|example)(?:/|$)">
    Require all denied
</LocationMatch>
