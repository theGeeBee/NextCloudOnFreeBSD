Listen 443
<VirtualHost *:80>
    ServerName @@PUBLIC_HOSTNAME@@
    DocumentRoot /usr/local/www/cloud-acme/empty
    Alias /.well-known/acme-challenge/ /usr/local/www/cloud-acme/.well-known/acme-challenge/
    <Directory /usr/local/www/cloud-acme/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://@@PUBLIC_AUTHORITY@@%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName @@PUBLIC_HOSTNAME@@
    DocumentRoot /usr/local/www/nextcloud
    Protocols h2 http/1.1
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLCertificateFile "@@TLS_CHAIN@@"
    SSLCertificateKeyFile "@@TLS_KEY@@"
    Header always set Strict-Transport-Security "max-age=15552000"
    <Directory /usr/local/www/nextcloud>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        # PHP/FPM enforce the upload/post budget; Nextcloud handles chunks.
        LimitRequestBody 0
        ProxyFCGIBackendType FPM
        SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/var/run/php-fpm/nextcloud.sock|fcgi://localhost/"
        </FilesMatch>
    </Directory>
</VirtualHost>
