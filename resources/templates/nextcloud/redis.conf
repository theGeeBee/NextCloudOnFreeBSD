# Ephemeral Nextcloud cache and locking state. Never evict an active lock.
port 0
protected-mode yes
unixsocket /var/run/redis/private/nextcloud.sock
unixsocketperm 660
daemonize yes
pidfile /var/run/redis/redis.pid
loglevel notice
logfile /var/log/redis/redis.log
dir /var/db/redis
databases 1
maxmemory @@REDIS_MEMORY_MB@@mb
maxmemory-policy noeviction
save ""
appendonly no
