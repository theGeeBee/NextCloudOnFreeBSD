# FreeBSD 15.1 newsyslog.conf(5), verified 2026-10-14:
# https://github.com/freebsd/freebsd-src/blob/releng/15.1/usr.sbin/newsyslog/newsyslog.conf.5
# Sizes are KiB; rotate at the size threshold or after 24 hours, keeping seven
# archives. Base cron checks hourly, so thresholds are not hard disk quotas.
# B avoids inserting text into logs; E skips empty files; Z compresses archives;
# P keeps .0 uncompressed while a graceful worker/cron may still hold it open.
# Apache SIGUSR1 is graceful; PHP-FPM SIGUSR1 reopens its master log.
# PHP main/main.c and fpm_php_trace.c open/close error/slow files for each write;
# Redis src/server.c:serverLogRaw() likewise opens/closes its file per message.
# These use N (no signal), as do one-shot cron jobs. Redis must not get SIGHUP.
# MySQL R executes the helper, not a signal against mariadbd; binlogs use the
# server's own seven-day retention, never newsyslog rotation.
# logfile                              owner:group mode count size  when flags command-or-pid [signal]
/var/log/httpd-access.log               root:wheel  640  7     65536 24   BEPZ  /var/run/httpd.pid SIGUSR1
/var/log/httpd-error.log                root:wheel  640  7     16384 24   BEPZ  /var/run/httpd.pid SIGUSR1
/var/log/php-fpm/fpm.log                root:www    640  7     16384 24   BEPZ  /var/run/php-fpm.pid SIGUSR1
/var/log/php-fpm/slow.log               root:www    640  7     16384 24   BENPZ
/var/log/php-fpm/callback-slow.log      root:www    640  7     16384 24   BENPZ
/var/log/php-fpm/php-error.log          www:www     640  7     16384 24   BENPZ
/var/log/redis/redis.log                redis:redis 640  7     16384 24   BENPZ
/var/log/mysql/mysqld.err               mysql:mysql 640  7     16384 24   BEPRZ /usr/local/libexec/cloud-mysql-flush-logs
/var/log/mysql/slow.log                 mysql:mysql 640  7     65536 24   BEPRZ /usr/local/libexec/cloud-mysql-flush-logs
/var/log/nextcloud/cron.log             www:www     640  7     16384 24   BENPZ
/var/log/letsencrypt/renew.log           root:wheel  600  7     16384 24   BENPZ
# nextcloud.log uses Nextcloud's own bounded 100-MiB rotation (current + backup).
