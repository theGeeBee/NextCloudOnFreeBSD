# The trusted external HTTPS frontend preserves Host and X-Forwarded-Proto.
# No HTTPS listener or TLS private key in this jail. PF restricts ingress.
<VirtualHost *:80>
    ServerName @@PUBLIC_HOSTNAME@@
    ServerAlias @@NEXTCLOUD_IP@@
    DocumentRoot /usr/local/www/nextcloud
    <Location />
        Require ip @@HTTP_CLIENTS@@
    </Location>
    Header always set Strict-Transport-Security "max-age=15552000"
    <Directory /usr/local/www/nextcloud>
        Options FollowSymLinks
        AllowOverride All
        Require ip @@HTTP_CLIENTS@@
        LimitRequestBody 0
        ProxyFCGIBackendType FPM
        SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/var/run/php-fpm/nextcloud.sock|fcgi://localhost/"
        </FilesMatch>
    </Directory>
</VirtualHost>
