; Loaded after package extension INIs and the packaged php.ini-production.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /var/log/php-fpm/php-error.log
zend.exception_ignore_args = On
date.timezone = "@@TIMEZONE@@"
default_charset = UTF-8
memory_limit = @@PHP_MEMORY_MB@@M
upload_max_filesize = @@UPLOAD_MAX_MB@@M
post_max_size = @@POST_MAX_MB@@M
max_execution_time = 3600
max_input_time = 3600
output_buffering = 0
upload_tmp_dir = /var/nc-tmp/uploads
sys_temp_dir = /var/nc-tmp/nextcloud
session.save_path = /var/nc-tmp/php-sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
; Apache's filesystem-mapped FPM handler supplies SCRIPT_FILENAME separately
; from PATH_INFO. Legacy mode substitutes rewritten PATH_TRANSLATED as a script.
; Keep the pool's .php-only execution restriction and test DAV/API path suffixes.
cgi.fix_pathinfo = 1
allow_url_fopen = On
allow_url_include = Off
sendmail_path = /usr/sbin/sendmail -t -i
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.jit = disable
opcache.jit_buffer_size = 0
pcre.jit = 0
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 64M
