# The external HTTPS reverse proxy must preserve the public Host (including its
# port), send X-Forwarded-Proto: https, and forward WebSocket Upgrade/Connection.
# This jail has no HTTPS listener, TLS certificate, or TLS module in this mode.
# PF limits ingress; this vhost also limits HTTP to proxies and private callbacks.
<VirtualHost *:80>
    ServerName @@PUBLIC_HOSTNAME@@
    ServerAlias @@NEXTCLOUD_IP@@
    DocumentRoot /usr/local/www/nextcloud
    <Location />
        Require ip @@HTTP_CLIENTS@@
    </Location>
    Header always set Strict-Transport-Security "max-age=15552000"
    <Directory /usr/local/www/nextcloud>
        Options FollowSymLinks
        AllowOverride All
        Require ip @@HTTP_CLIENTS@@
        LimitRequestBody 0
        ProxyFCGIBackendType FPM
        SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
        <FilesMatch "\.php$">
            # Real connection peer, never client-controlled forwarded headers.
            <If "%{CONN_REMOTE_ADDR} == '@@ONLYOFFICE_IP@@'">
                SetHandler "proxy:unix:/var/run/php-fpm/office-callback.sock|fcgi://localhost/"
            </If>
            <Else>
                SetHandler "proxy:unix:/var/run/php-fpm/nextcloud.sock|fcgi://localhost/"
            </Else>
        </FilesMatch>
    </Directory>
    # Installed only after the private ONLYOFFICE service is ready.
    IncludeOptional /usr/local/etc/apache24/cloud-onlyoffice.conf
</VirtualHost>
