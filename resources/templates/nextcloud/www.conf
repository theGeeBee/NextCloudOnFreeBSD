[www]
user = www
group = www
listen = /var/run/php-fpm/nextcloud.sock
listen.owner = www
listen.group = www
listen.mode = 0660
pm = dynamic
pm.max_children = @@PHP_CHILDREN@@
pm.start_servers = @@PHP_START_SERVERS@@
pm.min_spare_servers = @@PHP_MIN_SPARE@@
pm.max_spare_servers = @@PHP_MAX_SPARE@@
pm.max_requests = 500
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /var/nc-tmp/nextcloud
env[TMPDIR] = /var/nc-tmp/nextcloud
env[TEMP] = /var/nc-tmp/nextcloud
chdir = /usr/local/www/nextcloud
security.limit_extensions = .php
rlimit_core = 0
catch_workers_output = yes
request_slowlog_timeout = 30s
request_slowlog_trace_depth = 20
slowlog = /var/log/php-fpm/slow.log
request_terminate_timeout = 3660s
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/php-error.log
php_admin_value[memory_limit] = @@PHP_MEMORY_MB@@M
php_admin_value[upload_max_filesize] = @@UPLOAD_MAX_MB@@M
php_admin_value[post_max_size] = @@POST_MAX_MB@@M
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_time] = 3600

; Reserved for the paired office jail's callbacks, selected by connection IP.
; Included in (not added to) the total PHP worker memory allowance.
[office_callback]
user = www
group = www
listen = /var/run/php-fpm/office-callback.sock
listen.owner = www
listen.group = www
listen.mode = 0660
pm = dynamic
pm.max_children = @@PHP_CALLBACK_CHILDREN@@
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = @@PHP_CALLBACK_CHILDREN@@
pm.max_requests = 500
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /var/nc-tmp/nextcloud
env[TMPDIR] = /var/nc-tmp/nextcloud
env[TEMP] = /var/nc-tmp/nextcloud
chdir = /usr/local/www/nextcloud
security.limit_extensions = .php
rlimit_core = 0
catch_workers_output = yes
request_slowlog_timeout = 30s
request_slowlog_trace_depth = 20
slowlog = /var/log/php-fpm/callback-slow.log
request_terminate_timeout = 3660s
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/php-error.log
php_admin_value[memory_limit] = @@PHP_MEMORY_MB@@M
php_admin_value[upload_max_filesize] = @@UPLOAD_MAX_MB@@M
php_admin_value[post_max_size] = @@POST_MAX_MB@@M
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_time] = 3600
